name: Build Debug APK and Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail
          java -version 2>&1
          echo "JAVA_HOME=${JAVA_HOME:-}"

          VERSION_LINE=$(java -version 2>&1 | head -n 1 || true)
          RAW_VERSION=$(printf '%s\n' "$VERSION_LINE" | sed -n 's/.*"\([^"]*\)".*/\1/p')
          if [ -z "$RAW_VERSION" ]; then
            echo "::error::Could not detect active Java version from output: $VERSION_LINE"
            exit 1
          fi

          MAJOR_VERSION=$(printf '%s\n' "$RAW_VERSION" | awk -F. '{ if ($1 == "1") print $2; else print $1 }' | sed 's/[^0-9].*//')
          if [ -z "$MAJOR_VERSION" ]; then
            echo "::error::Could not parse active Java major version from: $RAW_VERSION"
            exit 1
          fi

          echo "Active Java major version: $MAJOR_VERSION"
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java $MAJOR_VERSION."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "./debug.keystore" ]; then
            echo "Found existing ./debug.keystore; skipping generation."
          else
            KEYTOOL_BIN=""
            if [ -n "${JAVA_HOME:-}" ] && [ -x "$JAVA_HOME/bin/keytool" ]; then
              KEYTOOL_BIN="$JAVA_HOME/bin/keytool"
            elif command -v keytool >/dev/null 2>&1; then
              KEYTOOL_BIN="$(command -v keytool)"
            else
              echo "::error::keytool was not found in the configured Java 17 installation."
              exit 1
            fi

            "$KEYTOOL_BIN" -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1 || {
                echo "::error::Failed to create temporary ./debug.keystore."
                exit 1
              }
          fi

          if [ ! -f "./debug.keystore" ] || [ ! -s "./debug.keystore" ]; then
            echo "::error::./debug.keystore is missing or empty after creation."
            exit 1
          fi
          echo "Temporary ./debug.keystore is ready."

      - name: Verify google-services.json
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ ! -s "app/google-services.json" ] && [ -n "${GOOGLE_SERVICES_JSON_SECRET:-}" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON_SECRET" > app/google-services.json
            echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON secret."
          fi

          if [ ! -s "app/google-services.json" ]; then
            echo "::error::app/google-services.json is missing. Commit app/google-services.json to the repository (or set GOOGLE_SERVICES_JSON in GitHub Secrets) so Firebase is packaged into the APK."
            exit 1
          fi

          echo "Verified app/google-services.json is present ($(wc -c < app/google-services.json) bytes)."

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -e "$APK_PATH" ]; then
            echo "::error::Expected debug APK not found at $APK_PATH"
            if [ -d "app/build/outputs/apk" ]; then
              echo "APK files discovered inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk" -print || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "$APK_PATH" ] || [ ! -s "$APK_PATH" ] || [[ "$APK_PATH" != *.apk ]]; then
            echo "::error::File $APK_PATH is not a valid non-empty .apk file."
            exit 1
          fi

          GENERATED_FIREBASE_RES="app/build/generated/res/processDebugGoogleServices/values/values.xml"
          if [ ! -f "$GENERATED_FIREBASE_RES" ] || ! grep -q 'name="google_app_id"' "$GENERATED_FIREBASE_RES"; then
            echo "::error::Firebase resources (google_app_id) were not packaged from app/google-services.json into the debug APK."
            exit 1
          fi

          echo "Verified debug APK: $APK_PATH ($(wc -c < "$APK_PATH") bytes) with Firebase configuration packaged."

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release_asset
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$SOURCE_APK" ] || [ ! -s "$SOURCE_APK" ] || [[ "$SOURCE_APK" != *.apk ]]; then
            echo "::error::Verified debug APK is missing or invalid at $SOURCE_APK"
            exit 1
          fi

          REPO_SHORT="${GITHUB_REPOSITORY##*/}"
          SAFE_REPO=$(printf '%s' "$REPO_SHORT" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')
          if [ -z "$SAFE_REPO" ]; then
            SAFE_REPO="android-app"
          fi

          TEMP_RELEASE_DIR=$(mktemp -d "${RUNNER_TEMP:-/tmp}/release-apk-XXXXXX")
          ASSET_NAME="${SAFE_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_PATH="${TEMP_RELEASE_DIR}/${ASSET_NAME}"

          cp -- "$SOURCE_APK" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Prepared release APK asset is invalid: $ASSET_PATH"
            exit 1
          fi

          echo "asset_path=${ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: ${ASSET_NAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_release_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_release_asset.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh --version

          if [ -z "${ASSET_PATH:-}" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Prepared release asset does not exist or is not a valid non-empty .apk file."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          NOTES_FILE=$(mktemp "${RUNNER_TEMP:-/tmp}/release-notes-XXXXXX.md")

          cat > "$NOTES_FILE" <<EOF
          This is an automatically generated debug APK built by GitHub Actions.

          - **Workflow Run Number:** ${GITHUB_RUN_NUMBER}
          - **Workflow Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA:** ${GITHUB_SHA}
          - **APK Asset:** \`${ASSET_NAME}\`

          ### Important Notes
          - This APK is intended for testing only.
          - This APK is **not** a Google Play Store production release.
          - This APK is signed only with a temporary debug keystore generated during the workflow run.
          EOF

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            --latest

          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_OUTCOME: ${{ steps.upload_artifact.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
          ASSET_NAME: ${{ steps.prepare_release_asset.outputs.asset_name }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url --jq '.url')
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "GitHub Release URL: $RELEASE_URL"
            echo "APK Asset Filename: ${ASSET_NAME:-unknown}"

            {
              echo "## Debug APK Published to GitHub Releases"
              echo ""
              echo "- **Release Tag:** \`$RELEASE_TAG\`"
              echo "- **Release Title:** $RELEASE_TITLE"
              echo "- **Release URL:** $RELEASE_URL"
              echo "- **APK Asset Filename:** \`${ASSET_NAME:-unknown}\`"
              echo ""
              echo "You can download the APK directly from the **Assets** section on the GitHub Release page."
              echo "The normal GitHub Actions artifact (\`app-debug-apk\`) is also available as a backup."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$UPLOAD_OUTCOME" = "success" ]; then
            echo "::warning::GitHub Release publishing failed, but the debug APK build succeeded and the Actions artifact 'app-debug-apk' remains available."
            {
              echo "## Debug APK Built (Release Publishing Failed)"
              echo ""
              echo "> **Warning:** Publishing to GitHub Releases did not succeed, so no release link is available for this run."
              echo ""
              echo "- The debug APK build **succeeded**."
              echo "- The GitHub Actions artifact named \`app-debug-apk\` remains available for download from this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::The debug APK build or artifact upload did not complete successfully."
            {
              echo "## Debug APK Build Did Not Complete"
              echo ""
              echo "Check the earlier build or verification steps for details."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
